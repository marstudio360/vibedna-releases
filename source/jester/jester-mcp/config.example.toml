# Jester daemon configuration. Copy to ~/.jester/config.toml to override defaults.
# Every key is optional. Unknown keys are silently ignored.
# Bad TOML falls back to defaults with a stderr warning; never crashes.
# BOM-prefixed files (PowerShell Out-File, Windows Notepad) are handled transparently.

[daemon]
# Network
host = "127.0.0.1"
port = 7843

# Lifecycle (seconds)
idle_timeout_s = 1800     # exit after 30 min with no requests
max_uptime_s = 3600       # recycle every 1 hour to dodge memory leaks
drain_timeout_s = 5.0     # max time to wait for in-flight on exit

# Resources
ram_cap_mb = 800          # recycle if RSS exceeds this (jester loads heavy ML models)

# Self-healing
heartbeat_interval_s = 30
heartbeat_timeout_s = 10

# Circuit breaker (per tool: a bad tool gets 503'd, half-open probe after cooldown)
circuit_failure_threshold = 5
circuit_cooldown_s = 60.0

# Observability
log_max_bytes = 5242880   # rotate daemon.jsonl past this size (5 MB)
metrics_window = 100      # latency samples kept per tool for percentiles
